# Nginx server block for the turmeric export site.
# Copy to /etc/nginx/sites-available/website-turmeric on the server, then:
#   sudo ln -s /etc/nginx/sites-available/website-turmeric /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your real domain (e.g. suvarnaturmeric.com) in the
# two places below before enabling. After DNS points at this server, run
# `sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN` — certbot will
# rewrite this file to add the HTTPS server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/website-turmeric/dist;
    index index.html;

    # gzip compression for text-based assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (script/style files with content hashes in the
    # filename) can be cached forever — a new deploy always ships new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached, so a new deploy is picked up
    # immediately instead of serving a stale shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: any unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
